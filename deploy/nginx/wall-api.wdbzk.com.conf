server {
    listen 80;
    server_name wall-api.wdbzk.com r.wdbzk.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wall-api.wdbzk.com;

    ssl_certificate     /www/server/panel/vhost/cert/wall-api.wdbzk.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wall-api.wdbzk.com/privkey.pem;

    client_max_body_size 1024m;

    location /assets/ {
        alias /www/wwwroot/wallpaper-manager/storage/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name r.wdbzk.com;

    ssl_certificate     /www/server/panel/vhost/cert/r.wdbzk.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/r.wdbzk.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4000/r/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
