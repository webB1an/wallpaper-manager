server {
    listen 80;
    server_name wall-admin.wdbzk.com;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/wallpaper-manager;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wall-admin.wdbzk.com;

    ssl_certificate     /www/server/panel/vhost/cert/wallpaper-manager/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wallpaper-manager/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AESGCM:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;

    root /www/wwwroot/wallpaper-manager/apps/admin/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/wallpaper-manager;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
