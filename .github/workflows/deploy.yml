name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wallpaper-manager-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build And Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/www/wwwroot/wallpaper-manager' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10 falls back to the retired quick-audit endpoint after a bulk timeout.
      - name: Setup npm
        run: npm install --global npm@11.12.1 --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1

      # Run one explicit, blocking production audit below instead of auditing twice.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        timeout-minutes: 2
        run: npm audit --omit=dev --fetch-timeout=30000 --fetch-retries=1

      - name: Validate
        env:
          DATABASE_URL: mysql://wallpaper_manager_user:password@127.0.0.1:3306/wallpaper_manager
        run: |
          npm run prisma:validate
          npm run prisma:generate
          npm run typecheck
          npm run lint
          npm run build
          npm run smoke:json
          npm run smoke:auth-code
          npm run smoke:short-code
          npm run smoke:query-values
          npm run verify:release

      - name: Prepare SSH
        id: prepare_ssh
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote path
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${DEPLOY_PATH}'"

      - name: Sync source to server
        run: |
          rsync -az --delete --human-readable \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.runs/' \
            --exclude='node_modules/' \
            --exclude='apps/*/node_modules/' \
            --exclude='packages/*/node_modules/' \
            --exclude='apps/api/.env' \
            --exclude='.env' \
            --exclude='/storage/' \
            --exclude='/uploads/' \
            --exclude='*.tar.gz' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT || '22' }}" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/"

      - name: Bootstrap production
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "APP_DIR='${DEPLOY_PATH}' bash '${DEPLOY_PATH}/deploy/bootstrap-server.sh'"

      - name: Smoke production
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${DEPLOY_PATH}' && npm run smoke:production && npm run smoke:storage-accounts && npm run smoke:channel-accounts && npm run smoke:upload-routing"

      - name: Launch readiness report
        if: ${{ always() && steps.prepare_ssh.outcome == 'success' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${DEPLOY_PATH}' && npm run preflight:env || true; npm run readiness:launch -- --allow-empty-appid || true"
